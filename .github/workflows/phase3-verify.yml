name: Phase 3 verify (temporary)

# 임시 검증용이다. ci.yml 은 main·PR 에서만 돌고 로컬은 npm 레지스트리가 차단돼 설치가
# 되지 않아, 기능 브랜치의 변경이 저장소 게이트를 깨는지 확인할 경로가 없다.
# 뮤테이션 재측정은 crap.yml 이 같은 push 에서 함께 돈다.
# Phase 3 검증이 끝나면 이 파일은 삭제한다 — 상시화 방식은 Task 8 에서 정한다.
on:
  push:
    branches: ['claude/**']

permissions:
  contents: read

jobs:
  verify:
    name: Phase 3 gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NODE_ENV: test
      SESSION_SECRET: ci-dummy-secret-32-chars-minimum!
      ALLOW_DEV_ADMIN: "false"
      POSTGRES_PRISMA_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      POSTGRES_URL_NON_POOLING: postgresql://ci:ci@localhost:5432/ci?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Gate — tsc
        run: npx tsc --noEmit && echo "tsc OK"

      - name: Gate — vitest
        run: npx vitest run 2>&1 | tail -8

      - name: Gate — npm run lint
        run: npm run lint && echo "lint OK"

      - name: Gate — build
        run: npm run build 2>&1 | tail -4
        env:
          NODE_ENV: production

      # Task 7 Step 2 — oauth-nonce 의 형태 가드 뮤턴트가 죽었는지 본다.
      - name: Task 7 — oauth-nonce 뮤테이션
        if: always()
        run: npx stryker run stryker.crap.config.json --mutate lib/oauth-nonce.ts 2>&1 | tail -60

      # Task 7 Step 1 — import-json-schema 의 rows 뮤턴트가 왜 살아남는지 조사한다.
      # 모듈 최상위에서 rows(...) 를 부르므로 undefined.optional() 로 죽어야 정상이다.
      # clear-text 출력의 "Tests ran:" 목록이 실제로 무엇이 돌았는지 보여준다.
      - name: Task 7 — import-json-schema 조사
        if: always()
        run: npx stryker run stryker.crap.config.json --mutate lib/import-json-schema.ts 2>&1 | tail -60
