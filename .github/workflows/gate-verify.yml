name: Gate verify (temporary)

# 임시 워크플로다. ci.yml 은 main PR 에서만 돌아 작업 브랜치에서는 게이트를
# 확인할 방법이 없다. Task F·G 판정이 끝나면 지운다.
on:
  push:
    branches: ["claude/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: Gate + regression inverse
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      NODE_ENV: test
      SESSION_SECRET: ci-dummy-secret-32-chars-minimum!
      ALLOW_DEV_ADMIN: "false"
      POSTGRES_PRISMA_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      POSTGRES_URL_NON_POOLING: postgresql://ci:ci@localhost:5432/ci?schema=public

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Encoding check
        run: npm run check:encoding
      - name: Type check
        run: npx tsc --noEmit
      - name: Test
        run: npx vitest run --pool=threads 2>&1 | tee vitest.log
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      # 게이트가 그린인 것을 확인한 뒤에 역검증한다. 순서가 반대면 결과를 해석할 수 없다.
      - name: Regression inverse check
        id: inverse
        continue-on-error: true
        run: node scripts/regression-inverse-check.mjs 2>&1 | tee inverse.log

      - name: Working tree must be clean after revert
        run: |
          if [ -n "$(git status --porcelain -- app lib)" ]; then
            echo "원복되지 않은 파일이 있다:"; git status --porcelain -- app lib; git diff -- app lib; exit 1
          fi
          echo "app·lib 원복 확인."

      - name: Summary
        if: always()
        run: |
          echo '===== 게이트 ====='
          grep -E "Test Files|Tests " vitest.log || echo "(없음)"
          echo
          echo '===== Task G 역검증 ====='
          sed -n '/Task G 회귀 역검증/,$p' inverse.log || echo "(없음)"

      - name: Fail if any test does not catch its defect
        run: |
          if [ "${{ steps.inverse.outcome }}" != "success" ]; then
            echo "회귀를 잡지 못하는 테스트가 있다."; exit 1
          fi
