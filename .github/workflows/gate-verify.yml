name: Gate verify (temporary)

# 임시 워크플로다. ci.yml 은 main 으로 가는 PR 에서만 돌아, 작업 브랜치에서는
# 게이트를 확인할 방법이 없다. Task E 검증이 끝나면 지운다.
on:
  push:
    branches: ["claude/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: Lint / Type check / Test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      NODE_ENV: test
      SESSION_SECRET: ci-dummy-secret-32-chars-minimum!
      ALLOW_DEV_ADMIN: "false"
      POSTGRES_PRISMA_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      POSTGRES_URL_NON_POOLING: postgresql://ci:ci@localhost:5432/ci?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Encoding check
        run: npm run check:encoding

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npx vitest run --pool=threads 2>&1 | tee vitest.log

      - name: Lint
        run: npm run lint

      # Task E 는 화면 구조를 건드리므로 빌드까지 확인한다. 타입 검사만으로는
      # Next 의 서버·클라이언트 경계 문제가 드러나지 않는다.
      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Reprint test summary
        if: always()
        run: grep -E "Test Files|Tests " vitest.log || echo "요약을 찾지 못했다"
