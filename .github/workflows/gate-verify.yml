name: Gate verify (temporary)

# 임시 워크플로다. ci.yml 은 main 으로 가는 PR 에서만 돌아, 작업 브랜치에서는
# 게이트를 확인할 방법이 없다. 이 브랜치의 검증이 끝나면 지운다.
on:
  push:
    branches: ["claude/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: Lint / Type check / Test / Mutation
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      NODE_ENV: test
      SESSION_SECRET: ci-dummy-secret-32-chars-minimum!
      ALLOW_DEV_ADMIN: "false"
      POSTGRES_PRISMA_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      POSTGRES_URL_NON_POOLING: postgresql://ci:ci@localhost:5432/ci?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Encoding check
        run: npm run check:encoding

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npx vitest run --pool=threads

      - name: Lint
        run: npm run lint

      - name: Prisma schema validate
        run: npx prisma validate

      # Task B 가 이 순수 모듈에 분기를 더했다. 커버리지는 "실행됐는가"만 말하므로
      # 새 분기가 단언까지 됐는지는 뮤테이션으로만 확인된다.
      - name: Mutation - import-cascade-guard
        run: npx stryker run stryker.crap.config.json --mutate lib/import-cascade-guard.ts

      - name: Mutation summary
        if: always()
        run: |
          node -e "
            const fs = require('fs');
            const path = 'stryker-crap-report.json';
            if (!fs.existsSync(path)) { console.log('보고서 없음'); process.exit(0); }
            const report = JSON.parse(fs.readFileSync(path, 'utf8'));
            let killed = 0, survived = 0, other = 0;
            const alive = [];
            for (const [file, entry] of Object.entries(report.files || {})) {
              for (const m of entry.mutants || []) {
                if (m.status === 'Killed') killed++;
                else if (m.status === 'Survived') { survived++; alive.push(file + ':' + m.location.start.line + ' ' + m.mutatorName); }
                else other++;
              }
            }
            console.log('killed=' + killed + ' survived=' + survived + ' other=' + other);
            for (const line of alive) console.log('SURVIVED ' + line);
          "
