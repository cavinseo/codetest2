name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint / Type check / Test / Build
    runs-on: ubuntu-latest

    # 실제로 접속하지 않는 더미 값이다. prisma generate 는 URL 이 해석되기만 하면 되고,
    # 테스트는 Prisma 를 mock 하며 빌드 시점에는 쿼리를 실행하지 않는다.
    env:
      NODE_ENV: test
      SESSION_SECRET: ci-dummy-secret-32-chars-minimum!
      ALLOW_DEV_ADMIN: "false"
      POSTGRES_PRISMA_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      POSTGRES_URL_NON_POOLING: postgresql://ci:ci@localhost:5432/ci?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # StrykerJS 10 이 Node >= 22 를 요구한다. 20 에서는 npm run test:mutation 이
          # 기동조차 못 해, 뮤테이션 게이트가 이 환경에서 성립하지 않았다.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
