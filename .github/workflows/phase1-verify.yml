name: Phase 1 verify (temporary)

# 임시 검증용이다. ci.yml 은 main·PR 에서만 돌아 기능 브랜치의 변경이 저장소 게이트를
# 깨는지 확인할 경로가 없고, 로컬은 npm 레지스트리가 차단돼 설치조차 되지 않는다.
# Phase 1 검증이 끝나면 이 파일은 삭제한다.
on:
  push:
    branches: ['claude/**']

permissions:
  contents: read

jobs:
  verify:
    name: Phase 1 gates
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      NODE_ENV: test
      SESSION_SECRET: ci-dummy-secret-32-chars-minimum!
      ALLOW_DEV_ADMIN: "false"
      POSTGRES_PRISMA_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      POSTGRES_URL_NON_POOLING: postgresql://ci:ci@localhost:5432/ci?schema=public

    steps:
      - uses: actions/checkout@v4
        with:
          # 기준선 측정을 위해 직전 커밋의 파일을 꺼내야 한다.
          fetch-depth: 0

      # Task 2 가 바꾼 값과 같은 버전으로 돌려, ci.yml 의 단계들이 Node 22 에서
      # 통과하는지 함께 확인한다.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Baseline — Task 1 단언 추가 이전
        run: |
          git checkout b41a741 -- tests/import-cascade-guard.test.ts
          npx vitest run 2>&1 | tail -8
          git checkout HEAD -- tests/import-cascade-guard.test.ts

      - name: Gate — tsc
        run: npx tsc --noEmit && echo "tsc: no errors"

      - name: Gate — vitest
        run: npx vitest run 2>&1 | tail -8

      - name: Gate — npm run lint
        run: npm run lint && echo "lint: no errors"

      - name: Gate — next lint
        run: npx next lint

      - name: Gate — build (ci.yml 과 동일)
        run: npm run build 2>&1 | tail -12
        env:
          NODE_ENV: production

      - name: Task 1 — 뮤턴트 소멸 확인
        run: npx stryker run stryker.crap.config.json --mutate lib/import-cascade-guard.ts 2>&1 | tail -45
