name: Phase 2 verify (temporary)

# 임시 검증용이다. ci.yml 은 main·PR 에서만 돌고 로컬은 npm 레지스트리가 차단돼 설치가
# 되지 않아, 기능 브랜치의 변경이 저장소 게이트를 깨는지 확인할 경로가 없다.
# CRAP·뮤테이션 재측정은 crap.yml 이 같은 push 에서 함께 돌므로 여기서는 게이트만 본다.
# Phase 2 검증이 끝나면 이 파일은 삭제한다.
on:
  push:
    branches: ['claude/**']

permissions:
  contents: read

jobs:
  verify:
    name: Phase 2 gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NODE_ENV: test
      SESSION_SECRET: ci-dummy-secret-32-chars-minimum!
      ALLOW_DEV_ADMIN: "false"
      POSTGRES_PRISMA_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      POSTGRES_URL_NON_POOLING: postgresql://ci:ci@localhost:5432/ci?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Gate — tsc
        run: npx tsc --noEmit && echo "tsc OK"

      - name: Gate — vitest
        run: npx vitest run 2>&1 | tail -30

      - name: Gate — npm run lint
        run: npm run lint && echo "lint OK"

      - name: Gate — build
        run: npm run build 2>&1 | tail -6
        env:
          NODE_ENV: production
