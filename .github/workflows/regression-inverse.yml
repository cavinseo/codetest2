name: Regression inverse check (temporary)

# 임시 워크플로다. 회귀 테스트가 실제로 결함을 잡는지 확인한다 —
# 수정만 되돌린 상태에서 그 테스트가 실패해야 정상이다.
# 판정이 끝나면 스크립트와 함께 지운다.
on:
  push:
    branches: ["claude/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inverse:
    name: Regression inverse check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NODE_ENV: test
      SESSION_SECRET: ci-dummy-secret-32-chars-minimum!
      ALLOW_DEV_ADMIN: "false"
      POSTGRES_PRISMA_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      POSTGRES_URL_NON_POOLING: postgresql://ci:ci@localhost:5432/ci?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # 되돌리기 전에 현재 상태가 그린인지부터 확인한다. 여기서 빨간불이면
      # 아래 결과를 해석할 수 없다.
      - name: Baseline green
        run: npx vitest run --pool=threads 2>&1 | tee baseline.log

      - name: Inverse check
        id: inverse
        continue-on-error: true
        run: node scripts/regression-inverse-check.mjs 2>&1 | tee inverse.log

      # 되돌린 파일이 남아 있으면 아래 판정이 오염된다. 스크립트가 원복하지만
      # 중간에 죽었을 수도 있으므로 직접 확인한다.
      - name: Working tree must be clean after revert
        run: |
          if [ -n "$(git status --porcelain -- app lib)" ]; then
            echo "원복되지 않은 파일이 있다:"
            git status --porcelain -- app lib
            git diff -- app lib
            exit 1
          fi
          echo "app·lib 원복 확인."

      # 새로 만든 순수 모듈은 되돌릴 "예전 코드"가 없다. 그 경우의 등가 검증은
      # 뮤테이션이다 — 테스트가 실행만 하는지, 단언까지 하는지를 본다.
      - name: Mutation - unsaved-changes (신설 모듈의 등가 검증)
        continue-on-error: true
        run: npx stryker run stryker.crap.config.json --mutate lib/unsaved-changes.ts 2>&1 | tee mutation.log

      - name: Summary
        if: always()
        run: |
          echo '===== 기준선 ====='
          grep -E "Test Files|Tests " baseline.log || echo "(없음)"
          echo
          echo '===== 역검증 ====='
          sed -n '/회귀 테스트 역검증 결과/,$p' inverse.log || echo "(없음)"
          echo
          echo '===== 신설 모듈 뮤테이션 ====='
          grep -E "^All files|unsaved-changes" mutation.log || echo "(없음)"

      - name: Fail if any test does not catch its defect
        run: |
          if [ "${{ steps.inverse.outcome }}" != "success" ]; then
            echo "회귀를 잡지 못하는 테스트가 있다. 위 요약을 보라."
            exit 1
          fi
